<!DOCTYPE html>
<html lang="si">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nepravilni glagoli</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@48,600,0,200" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Saira+Extra+Condensed:wght@400&display=swap" rel="stylesheet">

    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">

    <link rel="stylesheet" href="style.css">

  </head>
  <body id="body">

    <!-- "naprej" button -->
    <div style="visibility: hidden;" class="fixBtnRight" id="naprej">
      <p class="tooltiptext">naprej</p>
      <span class="material-symbols-rounded btnIcon">
        arrow_right_alt
      </span>
    </div>

    <!-- "preveri" button -->
    <div id="preveri" class="fixBtnRight">
      <p class="tooltiptext">preveri</p>
      <span class="material-icons btnIcon">&#xe5ca;</span>
    </div>

    <!-- "izpisi vse" button -->
    <div id="izpisiVse" class="fixBtnLeft" style="background-color: darkblue">
      <p class="tooltiptext">izpiši vse</p>
      <span class="material-icons btnIcon">&#xe865;</span>
    </div>

    <!-- Stevec Tock -->
    <div class="stevecTock"><span id="pravilno">0</span> / <span id="steviloNalog">0</span></div>
    <!-- "settings" button -->
    <div class="nastavitve" data-bs-toggle="modal" data-bs-target="#myModal"><span class="material-symbols-rounded"> settings </span></div>

    <!-- The Modal (for settings) -->
    <div class="modal fade" id="myModal">
      <div class="modal-dialog">
        <div class="modal-content">

          <!-- Modal Header -->
          <div class="modal-header">
            <h4 class="modal-title">Nastavitve</h4>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- Modal body -->
          <div class="modal-body">

            <p>Izberi, kateri prostorček naj bo v naprej izpolnjen: </p>
            <select class="form-select" id="set1">
              <option value="naključno">naključno</option>
              <option value="nedoločnik">nedoločnik</option>
              <option value="preteklik">preteklik</option>
              <option value="pretekli deležnik">pretekli deležnik</option>
              <option value="prevod">prevod</option>
            </select>

            <div class="pt-3" style="display: flex; align-items: center; justify-content: space-between;">
              <span>Temno ozadje <span class="tag beta">beta</span></span>
              <label class="switch" onclick="toggleTheme(document.getElementById('theme'));">
                <input type="checkbox" id="theme">
                <span class="slider round"></span>
              </label>
            </div>

            <div class="pt-3" style="display: flex; align-items: center; justify-content: space-between;">
              <span>Ponavljaj napačno rešeno vprašanje</span>
              <label class="switch">
                <input type="checkbox" id="repeatFailed" checked>
                <span class="slider round"></span>
              </label>
            </div>

          </div>

          <!-- Modal footer -->
          <div class="modal-footer bg-light">
            <div class = "row" style="width: 100%;">
              <div class = "col-sm-9"><small style="float: left;">Stran izdelal Gregor Potočnik.</small></div>
              <div  class="col-sm-3 pt-2"><button type="button" class="w-100 btn btn-success" style="float: right" data-bs-dismiss="modal" onclick="nastaviStStolpca(); nastaviPonavljajNapacno();">Shrani</button></div>
            </div>
          </div>

        </div>
      </div>
    </div>

    <h1 class = "pt-3 pt-3 pb-2" id="naslov"></h1>
    <p id="opis"></p>
    <br>

    <table id="seznamBesed"></table>
    <br>
    <br>

    <script src="slovar.js"></script>
    <script src="script.js"></script>
  </body>
</html>
